name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify VERSION file matches tag
        run: |
          file_version="$(cat VERSION | tr -d '[:space:]')"
          tag_version="${{ steps.version.outputs.version }}"
          if [ "$file_version" != "$tag_version" ]; then
            echo "ERROR: VERSION file ($file_version) does not match tag ($tag_version)"
            exit 1
          fi

      - name: Build release package
        run: bash deploy/package.sh --output-dir dist

      - name: Determine pre-release
        id: prerelease
        run: |
          if echo "${{ steps.version.outputs.version }}" | grep -q '-'; then
            echo "flag=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes
        id: notes
        run: |
          # Find the previous tag to diff against
          prev_tag=$(git tag --sort=-v:refname | grep -v "^${{ github.ref_name }}$" | head -1)

          {
            # Use annotated tag message if available
            tag_msg=$(git tag -l --format='%(contents)' "${{ github.ref_name }}" | sed '/^$/d')
            if [ -n "$tag_msg" ]; then
              echo "$tag_msg"
              echo ""
            fi

            # Append commit list
            if [ -n "$prev_tag" ]; then
              echo "## Commits"
              echo ""
              git log --oneline "${prev_tag}..${{ github.ref_name }}" | while read -r line; do
                echo "- ${line}"
              done
              echo ""
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${prev_tag}...${{ github.ref_name }}"
            fi
          } > release-notes.md

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create release if it doesn't exist yet (e.g. tag pushed via CLI)
          if ! gh release view "${{ github.ref_name }}" &>/dev/null; then
            gh release create "${{ github.ref_name }}" \
              ${{ steps.prerelease.outputs.flag }} \
              --title "${{ github.ref_name }}" \
              --notes-file release-notes.md
          else
            # Update existing release notes (e.g. web-created release with empty body)
            gh release edit "${{ github.ref_name }}" \
              --notes-file release-notes.md
          fi
          # Upload (--clobber overwrites if re-run)
          gh release upload "${{ github.ref_name }}" \
            dist/agent-exporter-to-langfuse-${{ steps.version.outputs.version }}.tar.gz \
            dist/SHA256SUMS \
            --clobber
