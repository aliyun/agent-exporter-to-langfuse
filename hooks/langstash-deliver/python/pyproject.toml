[project]
name = "langstash-deliver"
dynamic = ["version"]
description = "Delivery layer for Agent Exporter to Langfuse hooks (Python)"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "../../../VERSION"
pattern = "(?P<version>\\d+\\.\\d+\\.\\d+)"

[tool.hatch.build.targets.wheel]
packages = ["langstash_deliver"]
