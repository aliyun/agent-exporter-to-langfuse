[project]
name = "langstash-deliver"
version = "0.1.0"
description = "Delivery layer for Agent Exporter to Langfuse hooks (Python)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["langstash_deliver"]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
