[project]
name = "langstash"
version = "0.1.0"
description = "Local buffer service for Agent Exporter to Langfuse"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "httpx>=0.24",
]

[project.optional-dependencies]
macos = ["rumps>=0.4"]

[project.scripts]
langstash = "src.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
