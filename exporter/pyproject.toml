[project]
name = "langstash"
dynamic = ["version"]
description = "Local buffer service for Agent Exporter to Langfuse"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "httpx>=0.24",
]

[project.optional-dependencies]
macos = ["rumps>=0.4"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
langstash = "src.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "../VERSION"
pattern = "(?P<version>\\d+\\.\\d+\\.\\d+)"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
